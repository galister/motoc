[package]
name = "motoc"
version = "0.3.6"
edition = "2021"
description = "Monado Tracking Origin Calibrator"

[dependencies]
libmotoc = { path = "../libmotoc" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"
indicatif = "0.18"
log = "0.4"
libmonado = "1.6"
nalgebra = "0.34"
openxr = { version = "0.21", features = ["linked", "mint"], default-features = false }
openxr_mndx_xdev_space = "0.2.0"
