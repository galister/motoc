[package]
name = "motoc"
version = "0.4.0"
edition = "2021"
description = "Monado Tracking Origin Calibrator"

[dependencies]
libmotoc = { path = "../libmotoc" }

libmonado.workspace = true
log.workspace = true
mint.workspace = true
nalgebra.workspace = true
openxr.workspace = true
openxr_mndx_xdev_space.workspace = true

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"
indicatif = "0.18"
ratatui = "0.30.2"
